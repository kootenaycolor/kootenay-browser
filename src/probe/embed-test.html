<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Embed Test</title>
<style>body{margin:0;background:#111}iframe{border:0;width:640px;height:360px}</style>
</head>
<body>
  <!-- A cross-origin platform embed: the <video> lives in the iframe's own
       (youtube.com) document, i.e. a subframe of this file:// page. -->

    src="https://www.youtube.com/embed/aqz-KE-bpKQ?autoplay=1&mute=1"
    allow="autoplay"></iframe>
</body>
