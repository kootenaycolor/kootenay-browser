<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Color Settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow-y: auto; }
  header {
    height: 52px; -webkit-app-region: drag;
    display: flex; align-items: center; padding: 0 20px 0 84px;
    border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 13px;
  }
  main { padding: 20px; display: flex; flex-direction: column; gap: 24px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); margin: 0 0 10px;
  }
  .card {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  select, input[type=number], button {
    font-family: var(--font); font-size: 12.5px; color: var(--text);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 6px 10px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--border-strong); }
  button.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .display-card { margin-bottom: 12px; }
  .display-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .display-head .name { font-weight: 600; font-size: 13px; }
  .display-head .res { color: var(--text-secondary); font-size: 11px; }
  .badge-current {
    font-size: 10px; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 20px; padding: 1px 7px;
  }
  .profile {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--border); font-size: 12px;
  }
  .profile:first-of-type { border-top: none; }
  .profile .meta { flex: 1; }
  .profile .meta .sub { color: var(--text-secondary); font-size: 10.5px; }
  .profile .kindtag {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 6px; border-radius: 4px; background: var(--bg-inset);
    color: var(--text-secondary);
  }
  .profile .kindtag.light { color: var(--accent); }
  .empty { color: var(--text-secondary); font-size: 12px; font-style: italic; padding: 6px 0; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--text-secondary); font-size: 11px; }
  .import { margin-top: 10px; display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  .import.open { display: flex; }
  .result { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); margin-top: 8px; white-space: pre-wrap; }
  .del { color: var(--text-secondary); background: transparent; border: none; font-size: 14px; padding: 2px 6px; }
  .del:hover { color: #d9776a; }
</style>
</head>
<body>
  <header>Color Settings</header>
  <main>
    <section>
      <h2>Simple mode target</h2>
      <div class="card row">
        <span>Display-blind correction aims at this curve</span>
        <select id="simpleTarget"></select>
      </div>
      <div class="hint" style="margin-top:6px">
        The white paper's recommendation is Gamma 2.2 for web delivery.
      </div>
    </section>

    <section>
      <h2>Measured displays</h2>
      <div id="displays"></div>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
