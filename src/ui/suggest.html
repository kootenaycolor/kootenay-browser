<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; background: transparent; overflow: hidden; }
  #list {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 4px;
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px; border-radius: var(--radius-sm);
    cursor: default; overflow: hidden;
  }
  .row:hover, .row.sel { background: var(--bg-inset); }
  .row .t { color: var(--text); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 45%; }
  .row .u { color: var(--text-secondary); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .ico { width: 14px; height: 14px; flex: none; opacity: 0.7; }
</style>
</head>
<body>
  <div id="list"></div>
  <script src="suggest.js"></script>
</body>
</html>
