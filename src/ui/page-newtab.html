<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="page.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 720px; padding: 12vh 24px 40px; }
  .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 26px; }
  .brand .mark { width: 34px; height: 34px; }
  .brand h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .search {
    width: 100%; height: 48px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--bg-raised); color: var(--text);
    font-size: 15px; padding: 0 18px; outline: none; box-shadow: var(--shadow);
  }
  .search:focus { border-color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); margin: 34px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 8px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg-raised); cursor: pointer; text-align: center;
  }
  .tile:hover { border-color: var(--border-strong); }
  .tile img { width: 26px; height: 26px; border-radius: 6px; }
  .tile .t { font-size: 11.5px; color: var(--text); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; }
  .li:hover { background: var(--bg-inset); }
  .li img { width: 15px; height: 15px; flex: none; }
  .li .t { font-size: 13px; color: var(--text); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: none; max-width: 50%; }
  .li .u { font-size: 12px; color: var(--text-secondary); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .empty { color: var(--text-secondary); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="var(--bg-inset)"/><path d="M18 82 Q60 78 82 20" stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
      <h1>Kootenay</h1>
    </div>
    <input class="search" id="search" placeholder="Search or enter address" spellcheck="false" autofocus>

    <h2 id="topsites-h" style="display:none">Top sites</h2>
    <div class="grid" id="topsites"></div>

    <h2 id="bm-h" style="display:none">Bookmarks</h2>
    <div class="list" id="bookmarks"></div>

    <h2 id="recent-h" style="display:none">Recent</h2>
    <div class="list" id="recent"></div>
  </div>
  <script src="page-newtab.js"></script>
</body>
</html>
