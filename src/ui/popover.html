<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; background: transparent; overflow: hidden; }
  /* Full content-area backdrop: clicks here close the popover. The view is
     hidden when closed, so the page below stays interactive. */
  #backdrop { position: fixed; inset: 0; }

  #popover {
    position: fixed;
    top: 4px; right: 12px;
    width: 300px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    animation: pop 120ms ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
  #popover h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  #popover .sub {
    margin: 0 0 14px; font-size: 11.5px; color: var(--text-secondary);
    line-height: 1.45;
  }
  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .field label { font-size: 12.5px; color: var(--text-secondary); }
  .field select {
    -webkit-appearance: none;
    font-family: var(--font); font-size: 12.5px;
    color: var(--text);
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 24px 5px 10px;
    outline: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0l4 5 4-5z' fill='%23999'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
  }
  .field select:disabled { opacity: 0.4; cursor: default; }
  #pipeline-note {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-secondary); line-height: 1.5;
  }
  #pipeline-note .cal { color: var(--accent); cursor: pointer; }
  #note-line { margin-bottom: 8px; }
  #note-line .warn { color: #d9a441; }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="popover">
    <h3>Color Pipeline</h3>
    <p class="sub">Declare how this file was graded. The browser offsets what
    the platform and your display do to it, so you see the intended image.</p>
    <div class="field">
      <label>Method</label>
      <select id="method">
        <option value="off">Off</option>
        <option value="simple">Simple (target 2.2)</option>
        <option value="measured">Measured (this display)</option>
      </select>
    </div>
    <div class="field">
      <label>Source Gamma</label>
      <select id="source"></select>
    </div>
    <div id="pipeline-note">
      <div id="note-line"></div>
      <span class="cal" id="opensettings">Color settings…</span>
    </div>
  </div>
  <script src="popover.js"></script>
</body>
</html>
