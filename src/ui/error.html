<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { max-width: 420px; text-align: center; padding: 0 24px; }
  .glyph { font-size: 44px; margin-bottom: 12px; opacity: 0.55; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--text-secondary); line-height: 1.5; font-size: 13px; }
  .url { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
    word-break: break-all; margin: 10px 0 18px; }
  button {
    font-family: var(--font); font-size: 13px; color: var(--text);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 18px; cursor: pointer;
  }
  button:hover { border-color: var(--border-strong); }
</style>
</head>
<body>
  <div class="box">
    <div class="glyph">⚠</div>
    <h1>This page didn't load</h1>
    <p id="desc"></p>
    <div class="url" id="url"></div>
    <button onclick="location.href = document.getElementById('url').dataset.href">Try again</button>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const url = p.get('url') || '';
    const desc = p.get('desc') || 'The server could not be reached.';
    document.getElementById('desc').textContent =
      desc.replace(/_/g, ' ').replace(/^ERR /, '').toLowerCase();
    const u = document.getElementById('url');
    u.textContent = url;
    u.dataset.href = url;
  </script>
</body>
</html>
